plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gmail.denigroshev'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for chat bot telegram'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.telegram:telegrambots-spring-boot-starter:6.9.7.1'

    implementation 'org.apache.commons:commons-lang3:3.14.0'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ========== КРИТИЧЕСКИ ВАЖНО ДЛЯ RAILWAY ==========

// Отключаем обычный JAR (plain.jar)
jar {
    enabled = false
}

bootJar {
    archiveFileName = 'app.jar'  // Простое имя для Railway

    mainClass = 'com.gmail.denigroshev.kidsriot.chatbot.Application'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

springBoot {
    mainClass = 'com.gmail.denigroshev.MainApplication'
}